<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tank Manager</title>
  <meta name="theme-color" content="#0f6e74">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tank">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="tankTitle">Tank Manager</h1>
      <p id="tankSub" class="muted">Loading…</p>
    </div>
    <button id="refreshBtn" class="icon-btn" aria-label="Reload data" title="Reload data">⟳</button>
  </header>

  <main id="app">
    <section id="warnings" hidden></section>

    <section id="statusCard" class="card" hidden></section>

    <section id="readingsSection" hidden>
      <h2>Latest readings</h2>
      <div id="readings" class="grid"></div>
    </section>

    <section id="chartsSection" hidden>
      <h2>Trends</h2>
      <div class="legend">
        <span><i class="sw ok"></i>Normal range</span>
        <span><i class="sw danger"></i>Danger level</span>
        <span><i class="sw avg"></i>Your average</span>
      </div>
      <div id="charts"></div>
    </section>

    <section id="logSection" hidden>
      <h2>Test log</h2>
      <ol id="log" class="log"></ol>
    </section>

    <section id="empty" class="card" hidden>
      <h2>No data yet</h2>
      <p>Put <code>tank_water_log.csv</code> in the same GitHub folder as this app, or load the file from your phone below.</p>
    </section>
  </main>

  <footer class="foot">
    <label class="btn">
      Load CSV from phone
      <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
    </label>
    <p id="source" class="muted small"></p>
    <p class="muted small">App v1.0</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
