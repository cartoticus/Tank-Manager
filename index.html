<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tank Manager</title>
  <meta name="theme-color" content="#0f6e74">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tank">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="tankTitle">Tank Manager</h1>
      <p id="tankSub" class="muted">Loading…</p>
    </div>
    <div class="top-actions">
      <button id="learnBtn" type="button" class="learn-btn" aria-label="Learn: the nitrogen cycle">Learn</button>
      <button id="refreshBtn" class="icon-btn" aria-label="Reload data" title="Reload data">⟳</button>
    </div>
  </header>
  <nav id="tankSwitch" class="switch" aria-label="Choose tank" hidden></nav>

  <main id="app">
    <section id="warnings" hidden></section>

    <section id="statusCard" class="card" hidden></section>

    <section id="readingsSection" hidden>
      <h2>Latest readings</h2>
      <p class="tap-hint">Tap a reading for details and its 14-day trend</p>
      <div id="readings" class="grid"></div>
    </section>

    <section id="logSection" hidden>
      <h2>Test log</h2>
      <ol id="log" class="log"></ol>
    </section>

    <section id="empty" class="card" hidden>
      <h2>No data yet</h2>
      <p>Put <code>tank_water_log.csv</code> in the same GitHub folder as this app, or load the file from your phone below.</p>
    </section>
  </main>

  <footer class="foot">
    <label class="btn">
      Load CSV from phone
      <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
    </label>
    <p id="source" class="muted small"></p>
    <p class="muted small">App v1.5</p>
  </footer>

  <div id="detail" class="sheet-wrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="sheet-head">
        <h2 id="detailTitle">Reading</h2>
        <button id="detailClose" type="button" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="detailBody" class="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
